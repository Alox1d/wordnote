buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        // Only cloud-enabled local builds need the AG Connect build plugin.
        if (file('app/agconnect-services.json').exists()) {
            // AGConnect detects AGP through the legacy buildscript classpath.
            classpath 'com.android.tools.build:gradle:9.2.1'
            classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        }
    }
}

plugins {
    id 'com.android.application' version '9.2.1' apply false
    id 'com.android.library' version '9.2.1' apply false
    id 'com.android.legacy-kapt' version '9.2.1' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
