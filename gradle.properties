android.useAndroidX=true
# The bundled Java editor switches on resource IDs.
android.nonFinalResIds=false
android.nonTransitiveRClass=false
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Huawei OCR model AARs share the vendor namespace. Keep the documented AGP compatibility option.
android.uniquePackageNames=false

# AGConnect 1.9 uses applicationVariants; built-in Kotlin remains enabled.
android.newDsl=false
